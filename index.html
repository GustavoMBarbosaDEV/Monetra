<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Monetra — Controle financeiro</title>
<meta name="description" content="Controle de gastos pessoal: salário, recebimentos avulsos, despesas diárias, caixinha e visão geral.">

<link rel="stylesheet" href="style.css">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}#boot{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(75% 55% at 50% 44%,#0A2419,#030605 72%);color:#EEF5F0;font:700 30px Inter,"Segoe UI",system-ui,sans-serif;letter-spacing:-.02em;transition:opacity .35s cubic-bezier(.2,.8,.2,1)}#boot .bm{width:min(46vw,210px);height:auto;margin-bottom:8px;overflow:visible}#boot .bm path,#boot .bm rect{transform-box:fill-box}#boot .b1{animation:bmL .55s cubic-bezier(.2,.8,.2,1) both}#boot .b2{animation:bmR .55s cubic-bezier(.2,.8,.2,1) .12s both}#boot .b3{animation:bmU .55s cubic-bezier(.2,.8,.2,1) .2s both}#boot .bm rect{transform-origin:center bottom;animation:bmS .5s cubic-bezier(.34,1.56,.64,1) both}#boot .r1{animation-delay:.35s}#boot .r2{animation-delay:.48s}#boot .r3{animation-delay:.61s}#boot span{animation:bmT .6s ease .75s both}@keyframes bmL{from{opacity:0;transform:translateX(-18px)}}@keyframes bmR{from{opacity:0;transform:translateX(18px)}}@keyframes bmU{from{opacity:0;transform:translateY(18px)}}@keyframes bmS{from{transform:scaleY(0)}}@keyframes bmT{from{opacity:0;letter-spacing:.2em;transform:translateY(8px)}}#boot.sai{opacity:0;pointer-events:none}#boot.sai .bm{transform:scale(.9);transition:transform .35s ease}@media (prefers-reduced-motion:reduce){#boot{transition:none}#boot *{animation:none!important}}</style>
</head>
<body>
<script>/* acessibilidade: aplica as preferências antes de desenhar, para não piscar */try{var a=JSON.parse(localStorage.getItem("mb.a11y")||"{}"),r=document.documentElement;if(a.texto&&a.texto!==1){r.classList.add("a11y-texto");r.style.setProperty("--escala",String(a.texto));}["contraste:a11y-contraste","daltonismo:a11y-dalt","semMov:a11y-semmov","calmo:a11y-calmo","dislexia:a11y-dislexia","alvos:a11y-alvos","sublinhar:a11y-sublinhar"].forEach(function(p){p=p.split(":");if(a[p[0]])r.classList.add(p[1]);});if(localStorage.getItem("mb.privado")==="1")r.classList.add("privado");}catch(e){}</script>
<div id="boot" aria-hidden="true"><svg class="bm" viewBox="90 120 340 270" width="220" height="175"><defs><linearGradient id="bmW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C9D2CD"/></linearGradient><linearGradient id="bmG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2BE08A"/><stop offset="1" stop-color="#0BA86A"/></linearGradient><linearGradient id="bmB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34E897"/><stop offset="1" stop-color="#0E9F6E"/></linearGradient></defs><path class="b1" d="M100 135 L292 268 L257 302 L158 232 L158 378 L100 342 Z" fill="url(#bmW)"/><path class="b2" d="M257 250 L413 135 L413 190 L292 272 Z" fill="url(#bmG)"/><path class="b3" d="M358 222 L413 190 L413 345 L358 378 Z" fill="url(#bmG)"/><rect class="r1" x="195" y="352" width="32" height="24" rx="2" fill="url(#bmB)"/><rect class="r2" x="245" y="325" width="32" height="51" rx="2" fill="url(#bmB)"/><rect class="r3" x="295" y="293" width="32" height="83" rx="2" fill="url(#bmB)"/></svg><span>Monetra</span></div>
<div class="wrap" id="app">
  <div class="top"><div class="brand"><img class="logo" src="icons/logo-128.png" alt="" width="36" height="36"><h1>Monetra</h1><span class="status" id="status"><i></i>Carregando…</span></div></div>
  <div class="empty-state">Carregando…</div>
</div>
<script>
  /* tela de abertura: some sozinha se algo demorar */
  setTimeout(function(){ var b=document.getElementById("boot"); if(b){ b.classList.add("sai"); setTimeout(function(){ b.remove(); },400); } },6000);
  /* Service worker: deixa o app abrir sem internet e permite instalar como aplicativo */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(function () {}); });
  }
</script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
