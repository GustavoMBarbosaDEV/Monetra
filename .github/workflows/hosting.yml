name: Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CONTA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MB_CONTROLE_F70B6 }}
    steps:
      - name: Conferir credencial
        id: cred
        run: |
          if [ -z "$CONTA" ]; then
            echo "::notice::Secret FIREBASE_SERVICE_ACCOUNT_MB_CONTROLE_F70B6 ausente: deploy pulado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cred.outputs.ok == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.cred.outputs.ok == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ferramentas/package-lock.json
      - name: Montar dist/ (minificado)
        if: steps.cred.outputs.ok == 'true'
        working-directory: ferramentas
        run: |
          npm ci
          node build.mjs
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        if: steps.cred.outputs.ok == 'true'
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MB_CONTROLE_F70B6 }}
          projectId: mb-controle-f70b6
          target: monetraapp
          channelId: live
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        if: steps.cred.outputs.ok == 'true'
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MB_CONTROLE_F70B6 }}
          projectId: mb-controle-f70b6
          target: mb-controle-f70b6
          channelId: live
