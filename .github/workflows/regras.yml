name: Regras do Firestore

on:
  push:
    paths:
      - "firestore.rules"
      - "testes-regras/**"
      - ".github/workflows/regras.yml"
  pull_request:
    paths:
      - "firestore.rules"
      - "testes-regras/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testes-regras
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: testes-regras/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm test
