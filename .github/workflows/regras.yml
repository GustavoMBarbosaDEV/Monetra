name: Regras do Firestore

on:
  push:
    paths:
      - "firestore.rules"
      - "testes-regras/**"
      - "firebase.json"
      - ".github/workflows/regras.yml"
  pull_request:
    paths:
      - "firestore.rules"
      - "testes-regras/**"
      - "firebase.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testes-regras
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: testes-regras/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm test
